name: Prebuild
on:
  workflow_dispatch:
    inputs:
      tag:
        description: The tag of the release to prebuild, or none to only build the prebuilds
        required: false
permissions:
  contents: read
jobs:
  prebuild:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            arch: x64
          - os: ubuntu-22.04-arm
            platform: linux
            arch: arm64
          - os: ubuntu-24.04
            platform: android
            arch: arm64
          - os: ubuntu-24.04
            platform: android
            arch: arm
          - os: ubuntu-24.04
            platform: android
            arch: x64
          - os: ubuntu-24.04
            platform: android
            arch: ia32
          - os: macos-15
            platform: darwin
            arch: x64
          - os: macos-15
            platform: darwin
            arch: arm64
          - os: macos-15
            platform: ios
            arch: arm64
          - os: macos-15
            platform: ios
            arch: arm64
            tags: -simulator
            flags: --simulator
          - os: macos-15
            platform: ios
            arch: x64
            tags: -simulator
            flags: --simulator
          - os: windows-2022
            platform: win32
            arch: x64
          - os: windows-11-arm
            platform: win32
            arch: arm64
    runs-on: ${{ matrix.os }}
    name: Build / ${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.tags }}
    steps:
      - uses: holepunchto/actions/bare-base@v1
      - uses: holepunchto/actions/compile-prebuilds@v1
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
          flags: ${{ matrix.flags }}
          tags: ${{ matrix.tags }}
      - id: archive
        uses: holepunchto/actions/create-archive@v1
        with:
          paths: prebuilds/${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.tags }}
          format: tar.gz
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.tags }}
          path: ${{ steps.archive.outputs.path }}
  release:
    runs-on: ubuntu-latest
    if: ${{ inputs.tag }}
    environment:
      name: github
    permissions:
      contents: write
      id-token: write
      attestations: write
    needs: prebuild
    name: Release
    steps:
      - uses: holepunchto/actions/checkout@v1
      - uses: holepunchto/actions/download-prebuilds@v1
        with:
          prefix: archives
      - uses: holepunchto/actions/attest@v1
        with:
          subject-path: archives/*.tar.gz
      - uses: holepunchto/actions/create-github-release@v1
        with:
          draft: true
          tag: ${{ inputs.tag }}
          files: archives/*.tar.gz
